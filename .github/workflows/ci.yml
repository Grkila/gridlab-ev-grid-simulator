name: repository-checks

on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and runtime dependencies
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src scripts
      - name: Run offline repository tests
        run: python -m unittest discover -s tests -v
      - name: Import runtime modules
        run: python -c "import mvgrid.legacy.main; import mvgrid.novi_sad.model; import mvgrid.novi_sad.validation"
