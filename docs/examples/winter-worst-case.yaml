  annual_growth_rate: 0.03
  years_ahead: 0
  scenario: worst_case
  variation: base
  composition:
    mode: preserve_city
    residential: null
    commercial: null
    industrial: null
fleet:
  fleet_size: 100
  charger_kw: 7.4
  energy_kwh: 14.0
  efficiency: 0.9
  location_mix:
    residential: 0.7
    workplace: 0.2
    public: 0.1
strategies:
- immediate
- capacity_aware
seeds:
- 1
fleet_sizes: null
limits:
  min_voltage_pu: 0.95
  max_voltage_pu: 1.05
  max_loading_percent: 100.0
assertions: []
max_cases: 100
max_runtime_seconds: 600.0
stress_first: true
stop_on_violation: true
fixed_start_hour: 23
